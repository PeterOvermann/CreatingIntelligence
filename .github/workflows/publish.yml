name: Build and Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # ubuntu-24.04-arm adds native Linux aarch64 wheels (Raspberry Pi, Graviton, ...)
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.1.1
        env:
          # Wheels are py3-none-<platform>, so one Python per platform is enough.
          # Building more would produce identical filenames, which cibuildwheel rejects.
          CIBW_BUILD: "cp312-*"
          # 64-bit only; 32-bit systems fall back to the pure-Python backend.
          CIBW_ARCHS_LINUX: "auto64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          # macos-latest is Apple Silicon; cross-build Intel wheels as well.
          CIBW_ARCHS_MACOS: "arm64 x86_64"
          # The install never fails on a broken compile anymore, so make CI check
          # that the C backend is actually inside the wheel and loads.
          CIBW_TEST_COMMAND: >-
            python -c "import creating_intelligence as ci;
            assert ci.backend == 'c_ffi', ci.backend; print('C backend OK')"
        with:
          package-dir: ./src/python

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -q --upgrade pip build
      - name: Build sdist
        working-directory: ./src/python
        run: python -m build --sdist
      - name: Check sdist ships the C sources
        working-directory: ./src/python
        run: tar -tzf dist/*.tar.gz | grep 'c_build/memory.c'
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: ./src/python/dist/*.tar.gz

  pypi-publish:
    name: Upload release to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
