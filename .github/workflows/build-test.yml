name: Test Cross-Platform Build

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/python/**'
      - 'src/c/**'
      - '.github/workflows/build-test.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/python/**'
      - 'src/c/**'
      - '.github/workflows/build-test.yml'
  workflow_dispatch:
jobs:
  test-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install build dependencies
      run: python -m pip install -q --upgrade pip build setuptools wheel

    - name: Build the sdist
      working-directory: ./src/python
      run: python -m build --sdist

    - name: Install from the generated sdist
      shell: bash
      run: python -m pip install src/python/dist/*.tar.gz

    - name: Verify import
      run: python -c "from creating_intelligence import memory_c_ffi"