name: Test Cross-Platform Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install build dependencies
      # Matches the pip install step in build_package.sh
      run: python -m pip install -q --upgrade pip build setuptools wheel

    - name: Build the sdist
      working-directory: ./src/python
      # Matches the core command from build_package.sh
      run: python -m build --sdist

    - name: Install from the generated sdist
      # Uses wildcard to catch whatever .tar.gz was just generated
      run: python -m pip install src/python/dist/*.tar.gz

    - name: Verify import
      run: python -c "import creating_intelligence.libmemory"